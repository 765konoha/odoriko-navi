name: Notify rehearsal eve

# リハ前日の案内(notify-rehearsal-eve)を手で起動する。
#
# 毎晩21時の定時実行は Supabase の pg_cron が行う(migration 0022)。
# Actions の定期実行は数時間遅れることがあり、日付をまたぐと
# 関数が送らずに見送ってしまうため、定時実行はここから外した。
#
# ここは手動実行用に残す。dryRun で送らずに対象件数を確認したり、
# 定時実行が失敗した夜に force で送り直したりするのに使う。
#
# 必要な Secrets:
#   VITE_SUPABASE_URL         … デプロイでも使っているもの
#   SUPABASE_PUBLISHABLE_KEY  … sb_publishable_... の公開キー
#                               (Edge Function の入口は新しい形式のキーしか
#                                通さない。アプリの VITE_SUPABASE_ANON_KEY は
#                                旧形式の eyJ... なので使えない)
#   CRON_SECRET               … 関数側の Secrets と同じ文字列
on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: '送らずに対象件数だけ確認する'
        type: boolean
        default: false
      force:
        description: '夜以外(日本時間の正午より前)でも送る'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call notify-rehearsal-eve
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dryRun }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::VITE_SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY / CRON_SECRET を設定してください"
            exit 1
          fi
          case "$KEY" in
            sb_publishable_*) ;;
            *)
              echo "::error::SUPABASE_PUBLISHABLE_KEY には sb_publishable_ で始まるキーを入れてください"
              exit 1
              ;;
          esac
          body='{}'
          if [ "$DRY_RUN" = "true" ]; then body='{"dryRun":true}'
          elif [ "$FORCE" = "true" ]; then body='{"force":true}'; fi

          # 応答本文と状態コードを分けて受け取る
          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' \
            -X POST "$URL/functions/v1/notify-rehearsal-eve" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -d "$body")
          echo "HTTP $code"
          cat "$out"
          echo
          if [ "$code" != "200" ]; then
            echo "::error::通知の送信に失敗しました (HTTP $code)"
            exit 1
          fi
